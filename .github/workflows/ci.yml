name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov mypy types-requests

      - name: Typecheck (mypy --strict)
        run: mypy

      - name: Test (offline, mocked transport)
        run: pytest --cov=india_xbrl --cov-report=term-missing

      - name: Audit smoke test (no network)
        run: india-xbrl --audit --data-dir "$(mktemp -d)"

  taxonomy-vendored:
    # The taxonomy package is content, not a build artifact: prove it is
    # present and well-formed in the repo itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Taxonomy package present and valid
        run: |
          test -f "vendor/taxonomies/in-capmkt-finance/META-INF/taxonomyPackage.xml"
          test -f "vendor/taxonomies/in-capmkt-finance/META-INF/catalog.xml"
          test -f "vendor/taxonomies/in-capmkt-finance/IntegratedFinance_IndAS/in-capmkt-ent-2025-01-31.xsd"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"tp": "http://xbrl.org/2016/taxonomy-package"}
          root = ET.parse(
              "vendor/taxonomies/in-capmkt-finance/META-INF/taxonomyPackage.xml"
          ).getroot()
          pub = root.findtext("tp:publisher", None, ns)
          date = root.findtext("tp:publicationDate", None, ns)
          assert pub == "Securities and Exchange Board of India", pub
          assert date == "2025-01-31", date
          print(f"taxonomy package OK: {pub} {date}")
          PY
