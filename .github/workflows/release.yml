# Release: build sdist+wheel, run smoke tests, publish to PyPI.
#
# Authentication is PyPI **Trusted Publishing** (OIDC): no API token is stored
# anywhere. One-time setup on pypi.org (Account settings -> Publishing):
# register a pending publisher with
#
#     PyPI project name : india-xbrl-filings
#     owner             : dhananjaym182
#     repository        : india-xbrl-filings
#     workflow filename : release.yml
#     environment       : pypi
#
# After that, pushing a tag `vX.Y.Z` publishes to PyPI automatically. The tag
# must match the version in pyproject.toml.

name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/india-xbrl --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/india-xbrl-filings
    permissions:
      # Mandatory for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
