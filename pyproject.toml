[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "india-xbrl-filings"
version = "0.1.0"
description = "Discover and download Indian listed-company financial-result XBRL filings (NSE and BSE) with full provenance. Download + preserve + index only; parsing is out of scope for v1."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "india-xbrl-filings contributors" }]
keywords = ["xbrl", "nse", "bse", "india", "sebi", "indas", "financial-filings", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/dhananjaym182/india-xbrl-filings"
Repository = "https://github.com/dhananjaym182/india-xbrl-filings"
Issues = "https://github.com/dhananjaym182/india-xbrl-filings/issues"

[project.scripts]
india-xbrl = "india_xbrl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/india_xbrl"]

[tool.hatch.build.targets.sdist]
# Ship the vendored SEBI taxonomy package in sdists: it is content, not a
# build artifact, and the library cannot resolve schemas without it.
include = ["src", "tests", "vendor", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
